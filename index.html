// ============================================================
// UTIL — deterministic PRNG, hashing, small helpers.
// Nothing in sim code may touch Math.random(); every stream of
// randomness derives from the match seed through these.
// ============================================================

// FNV-1a string hash → 32-bit uint.
function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

// mulberry32 — small, fast, deterministic PRNG. Returns fn → [0,1).
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// A named random stream: rng('traffic') and rng('vandals') never
// perturb each other, so adding a draw in one system cannot shift
// every other system's sequence (determinism stays debuggable).
function makeRngPool(seedStr) {
  const streams = {};
  return function (name) {
    if (!streams[name]) streams[name] = mulberry32(hashStr(seedStr + '/' + name));
    return streams[name];
  };
}

function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
function lerp(a, b, t) { return a + (b - a) * t; }

// Pick index by weight array using rng value r in [0,1).
function weightedIndex(weights, r) {
  let total = 0;
  for (let i = 0; i < weights.length; i++) total += weights[i];
  if (total <= 0) return 0;
  let acc = 0;
  const target = r * total;
  for (let i = 0; i < weights.length; i++) {
    acc += weights[i];
    if (target < acc) return i;
  }
  return weights.length - 1;
}

// Random base-36 seed string for NEW matches only — generation itself
// never touches wall-clock time (§19: the time salt belongs here alone).
function randomSeedString() {
  const t = (typeof performance !== 'undefined' ? performance.now() : 0) + Date.now();
  return (Math.floor(t) % 1679616).toString(36) + Math.floor(Math.random() * 1296).toString(36);
}

// Plate generator: deterministic fictional plates, LLN-NNN shape.
function makePlate(rng) {
  const L = 'ABCDEFGHJKLMNPRSTUVWXYZ'; // no I,O,Q — plates stay legible at small sizes
  let p = '';
  p += L[Math.floor(rng() * L.length)];
  p += L[Math.floor(rng() * L.length)];
  p += Math.floor(rng() * 10);
  p += '-';
  for (let i = 0; i < 3; i++) p += Math.floor(rng() * 10);
  return p;
}

// ---- car identity: type, colour, damage — deterministic from the plate,
// so the same vehicle looks the same in traffic, in the case-file stills,
// and in a witness's description. Night-street palette: distinct without
// stealing any signal colour.
var CAR_TYPES = ['COMPACT', 'SEDAN', 'SPORTS CAR', 'SUV', 'PICKUP', 'VAN'];
var CAR_COLOR_TABLE = [
  { name: 'RED',    hex: 0x9c4038, tone: 'DARK' },
  { name: 'BLUE',   hex: 0x3d5a80, tone: 'DARK' },
  { name: 'WHITE',  hex: 0xc9cdd6, tone: 'LIGHT' },
  { name: 'BLACK',  hex: 0x23252c, tone: 'DARK' },
  { name: 'SILVER', hex: 0x9aa0ab, tone: 'LIGHT' },
  { name: 'GREEN',  hex: 0x52704f, tone: 'DARK' },
  { name: 'TAN',    hex: 0xa89078, tone: 'LIGHT' },
  { name: 'BROWN',  hex: 0x6b4f42, tone: 'DARK' },
  { name: 'YELLOW', hex: 0xb09a3f, tone: 'LIGHT' },
  { name: 'GREY',   hex: 0x6f7681, tone: 'DARK' }
];

function carIdentity(plate) {
  const h1 = hashStr(plate + '/t'), h2 = hashStr(plate + '/c'), h3 = hashStr(plate + '/d');
  const damage = [];
  if (h3 % 100 < 16) damage.push('CRACKED WINDSHIELD');
  if ((h3 >>> 3) % 100 < 13) damage.push('DENTED PANEL');
  if ((h3 >>> 7) % 100 < 10) damage.push('BROKEN TAILLIGHT');
  return {
    type: CAR_TYPES[h1 % CAR_TYPES.length],
    color: CAR_COLOR_TABLE[h2 % CAR_COLOR_TABLE.length],
    damage
  };
}

// What a witness actually says: usually the colour and type, sometimes
// just "a dark car" — vague enough that the stills still matter.
function witnessDescription(identity, r1, r2) {
  const color = r1 < 0.7 ? identity.color.name : (identity.color.tone === 'DARK' ? 'DARK' : 'LIGHT-COLORED');
  const type = r2 < 0.75 ? identity.type : 'CAR';
  return color + ' ' + type;
}

// Does a photographed car fit what the witness said? The description is
// "COLOR TYPE" where colour may be vague (DARK / LIGHT-COLORED) and type
// may be just CAR.
function descriptionMatches(desc, identity) {
  if (!desc) return false;
  const firstSpace = desc.indexOf(' ');
  const colorWord = desc.slice(0, firstSpace);
  const typeWord = desc.slice(firstSpace + 1);
  const colorOK = colorWord === identity.color.name ||
    (colorWord === 'DARK' && identity.color.tone === 'DARK') ||
    (colorWord === 'LIGHT-COLORED' && identity.color.tone === 'LIGHT');
  const typeOK = typeWord === 'CAR' || typeWord === identity.type;
  return colorOK && typeOK;
}

// Threshold band label for a value, from CONFIG bands [[min,label],...].
function bandLabel(bands, v) {
  let label = bands[0][1];
  for (const [min, name] of bands) if (v >= min) label = name;
  return label;
}

  module.exports = { hashStr, mulberry32, makeRngPool, clamp, lerp, weightedIndex, randomSeedString, makePlate, bandLabel };

// ============================================================
// MAPGEN
// ============================================================

// ============================================================
// MAPGEN — deterministic city grid from a seed string.
// Constrained and validated, never free-form: any failed
// invariant re-rolls (deterministic nonce counter, never a time
// salt), capped, then falls back to the baked golden seed.
// A judge must never see a generation failure.
// ============================================================

var MapGen = (() => {

  function nodeId(W, x, y) { return y * W + x; }

  // Build the full lattice, then carve.
  function generateOnce(seedStr, nonce) {
    const G = CONFIG.Grid, M = CONFIG.MapGen;
    const W = G.W, H = G.H;
    const rng = mulberry32(hashStr(seedStr + ':' + nonce));

    const nodes = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      nodes.push({ id: nodeId(W, x, y), x, y, exit: false, spawnZone: false, syndicate: false });
    }

    // Full lattice segments.
    let segs = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (x + 1 < W) segs.push({ a: nodeId(W, x, y), b: nodeId(W, x + 1, y), dir: 'H', arterial: false });
      if (y + 1 < H) segs.push({ a: nodeId(W, x, y), b: nodeId(W, x, y + 1), dir: 'V', arterial: false });
    }

    // Arterial corridors first (they are protected from removal): pick
    // whole rows/columns until the arterial fraction lands in band.
    const target = lerp(M.ARTERIAL_FRACTION_MIN, M.ARTERIAL_FRACTION_MAX, rng());
    const corridors = [];
    const rows = [], cols = [];
    for (let y = 1; y < H - 1; y++) rows.push(y);
    for (let x = 1; x < W - 1; x++) cols.push(x);
    const protectedSegs = new Set();
    const segKey = (a, b) => a < b ? a + '_' + b : b + '_' + a;
    const segByKey = new Map();
    segs.forEach(s => segByKey.set(segKey(s.a, s.b), s));
    let arterialCount = 0;
    while (arterialCount / segs.length < target && (rows.length || cols.length)) {
      const pickRow = rows.length && (!cols.length || rng() < 0.5);
      if (pickRow) {
        const y = rows.splice(Math.floor(rng() * rows.length), 1)[0];
        corridors.push({ kind: 'row', at: y });
        for (let x = 0; x + 1 < W; x++) {
          const s = segByKey.get(segKey(nodeId(W, x, y), nodeId(W, x + 1, y)));
          if (s && !s.arterial) { s.arterial = true; arterialCount++; protectedSegs.add(segKey(s.a, s.b)); }
        }
      } else {
        const x = cols.splice(Math.floor(rng() * cols.length), 1)[0];
        corridors.push({ kind: 'col', at: x });
        for (let y = 0; y + 1 < H; y++) {
          const s = segByKey.get(segKey(nodeId(W, x, y), nodeId(W, x, y + 1)));
          if (s && !s.arterial) { s.arterial = true; arterialCount++; protectedSegs.add(segKey(s.a, s.b)); }
        }
      }
    }

    // Remove a fraction of non-arterial segments, preserving connectivity.
    const removable = segs.filter(s => !protectedSegs.has(segKey(s.a, s.b)));
    const toRemove = Math.floor(segs.length * M.REMOVE_FRACTION);
    // shuffle removable deterministically
    for (let i = removable.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [removable[i], removable[j]] = [removable[j], removable[i]];
    }
    const removed = new Set();
    const liveAdj = () => {
      const adj = nodes.map(() => []);
      for (const s of segs) {
        if (removed.has(segKey(s.a, s.b))) continue;
        adj[s.a].push(s.b); adj[s.b].push(s.a);
      }
      return adj;
    };
    const connected = (adj) => {
      const seen = new Set([0]);
      const q = [0];
      while (q.length) {
        const n = q.pop();
        for (const m of adj[n]) if (!seen.has(m)) { seen.add(m); q.push(m); }
      }
      return seen.size === nodes.length;
    };
    let removedCount = 0;
    for (const s of removable) {
      if (removedCount >= toRemove) break;
      const k = segKey(s.a, s.b);
      removed.add(k);
      if (!connected(liveAdj())) { removed.delete(k); continue; }
      removedCount++;
    }
    segs = segs.filter(s => !removed.has(segKey(s.a, s.b)));

    // Final adjacency with segment ids.
    segs.forEach((s, i) => { s.id = i; });
    const adj = nodes.map(() => []);
    for (const s of segs) {
      adj[s.a].push({ node: s.b, seg: s.id });
      adj[s.b].push({ node: s.a, seg: s.id });
    }

    // Trim over-long dead ends: repeatedly re-check chains of degree-1.
    // (We do not re-add segments; we just validate later. Chains longer
    // than MAX_DEAD_END fail validation and re-roll.)

    // Exits: one per map side, on a road-connected edge node, spread out.
    const edgeSets = [
      nodes.filter(n => n.y === 0 && adj[n.id].length > 0),
      nodes.filter(n => n.y === H - 1 && adj[n.id].length > 0),
      nodes.filter(n => n.x === 0 && adj[n.id].length > 0),
      nodes.filter(n => n.x === W - 1 && adj[n.id].length > 0)
    ];
    const exits = [];
    for (let i = 0; i < M.EXITS; i++) {
      const set = edgeSets[i % edgeSets.length];
      if (!set.length) return null;
      const n = set[Math.floor(rng() * set.length)];
      if (exits.includes(n.id)) return null;
      n.exit = true; exits.push(n.id);
    }

    const map = { seed: seedStr, nonce, W, H, nodes, segs, adj, exits, corridors };
    map.distToExit = bfsMulti(map, exits);

    // Spawn zones: nodes far enough from every exit, spread by rejection.
    const candidates = nodes.filter(n => !n.exit && adj[n.id].length >= 2 && map.distToExit[n.id] >= M.MIN_ESCAPE_SEGMENTS);
    if (candidates.length < M.SPAWN_ZONES) return null;
    const zones = [];
    let guard = 200;
    while (zones.length < M.SPAWN_ZONES && guard-- > 0) {
      const n = candidates[Math.floor(rng() * candidates.length)];
      if (zones.some(z => Math.abs(nodes[z].x - n.x) + Math.abs(nodes[z].y - n.y) < 3)) continue;
      if (!zones.includes(n.id)) { zones.push(n.id); n.spawnZone = true; }
    }
    if (zones.length < M.SPAWN_ZONES) return null;
    map.spawnZones = zones;

    // Syndicate district: a spawn-zone-eligible node in the distance band.
    const synd = nodes.filter(n => !n.exit && adj[n.id].length >= 2 &&
      map.distToExit[n.id] >= M.SYNDICATE_DISTANCE_MIN && map.distToExit[n.id] <= M.SYNDICATE_DISTANCE_MAX);
    if (!synd.length) return null;
    const sn = synd[Math.floor(rng() * synd.length)];
    sn.syndicate = true;
    map.syndicate = sn.id;

    // Central district: the road node nearest the geometric centre.
    let center = -1, best = 1e9;
    for (const n of nodes) {
      if (!adj[n.id].length) continue;
      const d = Math.abs(n.x - (W - 1) / 2) + Math.abs(n.y - (H - 1) / 2);
      if (d < best) { best = d; center = n.id; }
    }
    map.center = center;

    // Recognisable parts of town: districts ring outward from downtown,
    // and three points of interest anchor the major crimes. All labels
    // are descriptive, never brands.
    const fromCenter = bfsMulti(map, [center]);
    const poiCandidates = nodes.filter(n => !n.exit && adj[n.id].length >= 2 &&
      map.distToExit[n.id] >= M.MIN_ESCAPE_SEGMENTS && n.id !== center)
      .sort((a, b) => fromCenter[a.id] - fromCenter[b.id]);
    if (poiCandidates.length < 3) return null;
    map.poi = {
      BANK: poiCandidates[0].id,
      OFFICE: poiCandidates[Math.min(1, poiCandidates.length - 1)].id,
      GROCERY: poiCandidates[Math.min(2 + Math.floor(rng() * 3), poiCandidates.length - 1)].id
    };
    map.districts = nodes.map(n => {
      if (n.id === map.poi.BANK) return 'BANK';
      if (n.id === map.poi.OFFICE) return 'OFFICE';
      if (n.id === map.poi.GROCERY) return 'GROCERY';
      if (n.syndicate) return 'SYNDICATE';
      const d = fromCenter[n.id];
      if (d === Infinity) return 'HOUSES';
      if (d <= 2) return 'DOWNTOWN';
      if (d <= 5) return 'APARTMENTS';
      return 'HOUSES';
    });

    return map;
  }

  // Multi-source BFS over segments; returns array of hop distances.
  function bfsMulti(map, sources) {
    const dist = new Array(map.nodes.length).fill(Infinity);
    const q = [];
    for (const s of sources) { dist[s] = 0; q.push(s); }
    let head = 0;
    while (head < q.length) {
      const n = q[head++];
      for (const e of map.adj[n]) {
        if (dist[e.node] === Infinity) { dist[e.node] = dist[n] + 1; q.push(e.node); }
      }
    }
    return dist;
  }

  // Edge-disjoint route count from src to any exit (unit-capacity max flow,
  // Edmonds-Karp on the segment graph with a virtual super-sink).
  function edgeDisjointRoutes(map, src) {
    const N = map.nodes.length;
    const SINK = N;
    const cap = new Map(); // 'a>b' -> residual capacity
    const key = (a, b) => a + '>' + b;
    for (const s of map.segs) {
      cap.set(key(s.a, s.b), 1);
      cap.set(key(s.b, s.a), 1);
    }
    for (const e of map.exits) cap.set(key(e, SINK), 1e9);
    const neighbors = (n) => {
      if (n === SINK) return [];
      const out = map.adj[n].map(e => e.node);
      if (map.nodes[n].exit) out.push(SINK);
      return out;
    };
    let flow = 0;
    for (let iter = 0; iter < 16; iter++) {
      const prev = new Array(N + 1).fill(-1);
      prev[src] = src;
      const q = [src];
      let head = 0, found = false;
      while (head < q.length && !found) {
        const n = q[head++];
        for (const m of neighbors(n)) {
          if (prev[m] === -1 && (cap.get(key(n, m)) || 0) > 0) {
            prev[m] = n;
            if (m === SINK) { found = true; break; }
            q.push(m);
          }
        }
      }
      if (!found) break;
      let n = SINK;
      while (n !== src) {
        const p = prev[n];
        cap.set(key(p, n), (cap.get(key(p, n)) || 0) - 1);
        cap.set(key(n, p), (cap.get(key(n, p)) || 0) + 1);
        n = p;
      }
      flow++;
    }
    return flow;
  }

  function longestStraightRun(map) {
    const W = map.W, H = map.H;
    const has = new Set();
    for (const s of map.segs) has.add(s.a < s.b ? s.a + '_' + s.b : s.b + '_' + s.a);
    const k = (a, b) => a < b ? a + '_' + b : b + '_' + a;
    let best = 0;
    for (let y = 0; y < H; y++) {
      let run = 0;
      for (let x = 0; x + 1 < W; x++) {
        if (has.has(k(y * W + x, y * W + x + 1))) { run++; best = Math.max(best, run); }
        else run = 0;
      }
    }
    for (let x = 0; x < W; x++) {
      let run = 0;
      for (let y = 0; y + 1 < H; y++) {
        if (has.has(k(y * W + x, (y + 1) * W + x))) { run++; best = Math.max(best, run); }
        else run = 0;
      }
    }
    return best;
  }

  function deadEndTooLong(map, maxLen) {
    for (const n of map.nodes) {
      if (map.adj[n.id].length !== 1) continue;
      // walk the chain until a junction; count segments
      let prev = n.id, cur = map.adj[n.id][0].node, len = 1;
      while (map.adj[cur].length === 2 && len <= maxLen + 1) {
        const next = map.adj[cur].find(e => e.node !== prev);
        prev = cur; cur = next.node; len++;
      }
      if (len > maxLen) return true;
    }
    return false;
  }

  // How many other mountable poles a camera at n could watch: nodes along
  // straight contiguous road rays within POST range in the four directions.
  function visiblePoles(map, n) {
    const node = map.nodes[n];
    const range = CONFIG.Cameras.POST.RANGE;
    const k = (a, b) => a < b ? a + '_' + b : b + '_' + a;
    const has = new Set(map.segs.map(s => k(s.a, s.b)));
    let count = 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      let x = node.x, y = node.y;
      for (let d = 1; d <= range; d++) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= map.W || ny >= map.H) break;
        if (!has.has(k(y * map.W + x, ny * map.W + nx))) break;
        count++;
        x = nx; y = ny;
      }
    }
    return count;
  }

  function validate(map) {
    const M = CONFIG.MapGen;
    if (!map) return 'gen-null';
    // 1. three distinct routes centre → exits
    if (edgeDisjointRoutes(map, map.center) < M.MIN_ROUTES_TO_EXIT) return 'routes';
    // 2. spawn zones at distance from exits (built in, but assert)
    for (const z of map.spawnZones) if (map.distToExit[z] < M.MIN_ESCAPE_SEGMENTS) return 'escape-dist';
    // 3. straight run for the Long
    if (longestStraightRun(map) < M.MIN_STRAIGHT_RUN) return 'straight-run';
    // 4. arterial fraction
    const af = map.segs.filter(s => s.arterial).length / map.segs.length;
    if (af < M.ARTERIAL_FRACTION_MIN || af > M.ARTERIAL_FRACTION_MAX) return 'arterial-fraction';
    // 5. max incident segments
    for (const a of map.adj) if (a.length > 4) return 'valence';
    // 6. syndicate distance band
    const sd = map.distToExit[map.syndicate];
    if (sd < M.SYNDICATE_DISTANCE_MIN || sd > M.SYNDICATE_DISTANCE_MAX) return 'syndicate-dist';
    // 7. watcher poles: cameras-watching-cameras must be discoverable
    let watchers = 0;
    for (const n of map.nodes) {
      if (!map.adj[n.id].length || n.exit) continue;
      if (visiblePoles(map, n.id) >= M.WATCHER_SEES) watchers++;
    }
    if (watchers < M.MIN_WATCHER_POLES) return 'watchers';
    // 8. dead ends
    if (deadEndTooLong(map, M.MAX_DEAD_END)) return 'dead-end';
    return null;
  }

  function generate(seedStr) {
    const M = CONFIG.MapGen;
    for (let nonce = 0; nonce < M.MAX_REROLLS; nonce++) {
      const map = generateOnce(seedStr, nonce);
      if (!validate(map)) { map.fallback = false; return map; }
    }
    // Golden-seed fallback — a judge never sees a generation failure.
    for (let nonce = 0; nonce < M.MAX_REROLLS; nonce++) {
      const map = generateOnce(M.GOLDEN_SEED, nonce);
      if (!validate(map)) { map.fallback = true; return map; }
    }
    throw new Error('mapgen: golden seed failed validation — unreachable by test');
  }

  return { generate, generateOnce, validate, bfsMulti, edgeDisjointRoutes, longestStraightRun, visiblePoles };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = { MapGen };

// ============================================================
// STATE
// ============================================================

// ============================================================
// STATE — match state factory, deterministic rng streams,
// the event/log plumbing, and the Actions facade that both the
// UI and the headless trial player call. No DOM anywhere here.
// ============================================================

// Actions is the single verb surface: UI buttons and the scripted
// trial player call exactly these, so a swept constant was exercised
// through the same code path a player uses.
var Actions = {};

var State = (() => {

  // Named deterministic rng streams stored as plain data (uint32 per
  // stream) so save/resume serialises them and the sequence continues.
  function rngNext(state, name) {
    let a = state.rngState[name];
    if (a === undefined) a = hashStr(state.seed + '/' + name);
    a = (a + 0x6D2B79F5) >>> 0;
    state.rngState[name] = a;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  function log(state, msg, onceKey) {
    if (onceKey) {
      if (state.seenKeys[onceKey]) return;
      state.seenKeys[onceKey] = true;
    }
    state.logLines.push({ t: state.time, msg });
    if (state.logLines.length > 120) state.logLines.shift();
    emit(state, { type: 'log', msg });
  }

  // Events are a cursor-based ring: every consumer (renderer, audio,
  // tests, the demo) tracks its own seq and asks for "events since". They
  // are never cleared mid-pipeline — actions fire between ticks and their
  // events must survive to the next consumer read.
  function emit(state, ev) {
    ev.t = state.time;
    ev.seq = ++state.eventSeq;
    state.events.push(ev);
    if (state.events.length > 400) state.events.splice(0, state.events.length - 400);
  }

  function eventsSince(state, seq) {
    const out = [];
    for (const ev of state.events) if (ev.seq > seq) out.push(ev);
    return out;
  }

  function newMatch(seed, opts) {
    opts = opts || {};
    const map = MapGen.generate(seed);
    const E = CONFIG.Economy;
    const state = {
      version: 1,
      seed, map,
      time: 0,
      rngState: {},
      threshold: CONFIG.Threshold.START,
      budget: E.START_BUDGET,
      trust: E.TRUST_START,
      // clearance as a rolling percentage seeded with a prior so one early
      // cold case is not lethal (§15.2)
      clrClosed: E.CLEARANCE_PRIOR * E.CLEARANCE_START / 100,
      clrCold: E.CLEARANCE_PRIOR * (1 - E.CLEARANCE_START / 100),
      warrant: 0,
      cameras: [], nextCamId: 1,
      reads: [], nextReadId: 1,
      cases: [], nextCaseId: 1,
      vehicles: [], nextVehId: 1,
      vandals: [], nextVandalId: 1,
      crews: {},
      shift: {
        num: 0, nextAt: CONFIG.Shifts.FIRST_AT, telegraphed: false,
        overtime: 0, escalation: 1.0, rainUntil: 0,
        reviewRefused: false, reviewPending: false
      },
      ladder: { tier: opts.tier !== undefined ? opts.tier : CONFIG.Ladder.START_TIER },
      dda: !!opts.dda,               // silent skill matching runs in real matches only
      tutorialActive: false,          // main sets true; shifts hold while it runs
      verdict: null,
      contestedThisShift: 0,
      falseChargesThisShift: 0,
      warn: { clearance: -1, trust: -1 }, // shift number when the floor warning fired
      events: [], eventSeq: 0,
      logLines: [],
      seenKeys: opts.seenKeys || {},
      covSegs: null, covNodes: null,  // rebuilt by Sightlines.rebuildCoverage
      stats: {
        built: 0, destroyed: 0, reads: 0, qualifying: 0, falseAttached: 0,
        closures: 0, falseCharges: 0, colds: 0, contestedShown: 0,
        contestedResolved: 0, autoReleased: 0, crimes: 0, vandalsSpawned: 0,
        vandalActs: 0, vandalAbandons: 0, dataLostReads: 0, reroutes: 0,
        witnessCases: 0, bounties: 0, tips: 0, uploads: 0, identified: 0
      }
    };

    // Standing crews: two petty, one major, one syndicate. Vandal crews
    // are created per shift as they spawn. Crews learn *only* from being
    // sighted (§20.3); known maps camId → last-sighted sim-time.
    addCrew(state, 'petty-a', 'PETTY');
    addCrew(state, 'petty-b', 'PETTY');
    addCrew(state, 'major-a', 'MAJOR');
    addCrew(state, 'syndicate', 'SYNDICATE');

    Sightlines.rebuildCoverage(state);
    return state;
  }

  function addCrew(state, id, kind) {
    // each crew runs its own tuning, sampled deterministically (player-
    // directed individuality): traits a log line could name, not a policy
    const M = CONFIG.CrewMemory;
    const draw = (band) => band[0] + rngNext(state, 'crewtraits') * (band[1] - band[0]);
    const traits = {
      learn: draw(M.TRAIT_LEARN) + (kind === 'SYNDICATE' ? M.SYNDICATE_PRO : 0),
      avoid: draw(M.TRAIT_AVOID),
      bold: draw(M.TRAIT_BOLD)
    };
    state.crews[id] = {
      id, kind, traits,
      known: {},            // camId -> time last sighted
      activeKnown: [],      // snapshot used for routing (rate-limited, §13.3)
      lastRelearn: -Infinity,
      plate: null,          // syndicate keeps a persistent plate for case continuity
      damage: 0,            // vandal crews: value destroyed, prices the bounty
      caught: false,
      rerouteAnnounced: false
    };
    return state.crews[id];
  }

  // Clearance as a percentage for HUD/verdicts.
  function clearance(state) {
    const total = state.clrClosed + state.clrCold;
    return total <= 0 ? CONFIG.Economy.CLEARANCE_START : 100 * state.clrClosed / total;
  }

  function thresholdBand(state) {
    return bandLabel(CONFIG.Threshold.BANDS, state.threshold);
  }

  return { newMatch, addCrew, rngNext, log, emit, eventsSince, clearance, thresholdBand };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = { State, Actions };

// SIGHTLINES
// ============================================================

// ============================================================
// SIGHTLINES — what a camera sees and how well. A sightline is
// a function of type, distance and geometry, never a circle;
// confidence is environmental, never random (§6).
// ============================================================

var Sightlines = (() => {

  const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // E, S, W, N
  const QUADRANT_NAMES = ['SE', 'SW', 'NW', 'NE'];  // POST aim labels (ray pairs E+S, S+W, W+N, N+E)
  const DIR_NAMES = ['EAST', 'SOUTH', 'WEST', 'NORTH'];

  function segBetween(map, a, b) {
    for (const e of map.adj[a]) if (e.node === b) return e.seg;
    return -1;
  }

  // Sightline entries: { seg, dist, oblique } — dist is 1-indexed segments
  // from the pole, oblique marks cross-traffic seen at an angle. Vision
  // travels along street corridors only: buildings occlude everything
  // else, and a ray stops where the road does.
  // POST: aimed QUADRANT — two adjacent rays (E+S, S+W, W+N, N+E), range
  //       2, plus oblique crossings at ray nodes. Aimed at placement,
  //       forever — fixed-sector doctrine.
  // LONG: one aimed ray, range 5, no obliques — a narrow corridor.
  // DOME: all four rays at range 1 plus obliques — the unaimed corner unit.
  // RELAY: sees nothing.
  function compute(map, nodeIdx, type, dir) {
    const spec = CONFIG.Cameras[type];
    const out = [];
    if (!spec || spec.RANGE === 0) return out;
    const seen = new Set();
    const node = map.nodes[nodeIdx];
    const d0 = dir || 0;
    const dirs = spec.DIRECTIONS === 1 ? [DIRS[d0]]
      : spec.DIRECTIONS === 2 ? [DIRS[d0], DIRS[(d0 + 1) % 4]]
      : DIRS;

    for (const [dx, dy] of dirs) {
      let x = node.x, y = node.y, cur = nodeIdx;
      for (let d = 1; d <= spec.RANGE; d++) {
        const nx = x + dx, ny = y + dy;
        if (nx < 0 || ny < 0 || nx >= map.W || ny >= map.H) break;
        const nxt = ny * map.W + nx;
        const seg = segBetween(map, cur, nxt);
        if (seg < 0) break;           // the ray stops at a missing road
        if (!seen.has(seg)) { seen.add(seg); out.push({ seg, dist: d, oblique: false }); }
        // cross-traffic at the ray node reads at an angle (POST/DOME only)
        if (spec.DIRECTIONS > 1) {
          for (const e of map.adj[nxt]) {
            if (e.node === cur) continue;
            const en = map.nodes[e.node];
            const along = (en.x - nx) === dx && (en.y - ny) === dy;
            if (along) continue;      // that's the next ray segment, not a crossing
            if (!seen.has(e.seg)) { seen.add(e.seg); out.push({ seg: e.seg, dist: d, oblique: true }); }
          }
        }
        x = nx; y = ny; cur = nxt;
      }
    }
    return out;
  }

  // Static base confidence of a camera type for one sightline entry —
  // everything environmental and permanent: distance, angle, road class,
  // unit optics. Rain and degradation apply at read time.
  function baseConfidence(map, entry, type) {
    const C = CONFIG.Confidence;
    let conf = C.BASE + CONFIG.Cameras[type].CONF_MOD;
    conf -= (entry.dist - 1) * C.PER_SEGMENT_FALLOFF;
    if (entry.oblique) conf -= C.OBLIQUE_PENALTY;
    if (map.segs[entry.seg].arterial) conf -= C.ARTERIAL_PENALTY;
    return clamp(Math.round(conf), 0, 100);
  }

  // Live confidence for a camera reading on a segment right now.
  function liveConfidence(state, cam, entry) {
    const C = CONFIG.Confidence;
    let conf = baseConfidence(state.map, entry, cam.type);
    if (state.shift.rainUntil > state.time) conf -= C.RAIN_PENALTY;
    conf -= cam.tags * C.DEGRADE_PER_TAG;
    return clamp(Math.round(conf), Math.min(C.DEGRADE_FLOOR, conf > 0 ? conf : 0), 100);
  }

  // The placement ghost quotes its quality before you commit (§6.3):
  // best and worst base confidence from this pole at this aim.
  function quoteQuality(state, nodeIdx, type, dir) {
    const entries = compute(state.map, nodeIdx, type, dir);
    if (!entries.length) return null;
    let best = -1, worst = 101, worstArterial = false;
    for (const e of entries) {
      const c = baseConfidence(state.map, e, type);
      if (c > best) best = c;
      if (c < worst) { worst = c; worstArterial = state.map.segs[e.seg].arterial; }
    }
    return { best, worst, worstArterial, count: entries.length };
  }

  // Coverage indices: segId → [camIds] and nodeId → [camIds] (a pole is
  // watched when a camera's sightline touches a segment incident to it —
  // the §11.3 cameras-watching-cameras mechanic).
  function rebuildCoverage(state) {
    const covSegs = new Map(), covNodes = new Map();
    for (const cam of state.cameras) {
      for (const e of cam.sight) {
        if (!covSegs.has(e.seg)) covSegs.set(e.seg, []);
        covSegs.get(e.seg).push(cam.id);
        const s = state.map.segs[e.seg];
        for (const n of [s.a, s.b]) {
          if (!covNodes.has(n)) covNodes.set(n, []);
          const l = covNodes.get(n);
          if (!l.includes(cam.id)) l.push(cam.id);
        }
      }
    }
    state.covSegs = covSegs; state.covNodes = covNodes;
  }

  function camerasWatchingNode(state, nodeIdx, excludeCamId) {
    const l = state.covNodes.get(nodeIdx) || [];
    return excludeCamId === undefined ? l : l.filter(id => id !== excludeCamId);
  }

  function aimLabel(type, dir) {
    const spec = CONFIG.Cameras[type];
    if (!spec || spec.RANGE === 0 || spec.DIRECTIONS >= 4) return null;
    return spec.DIRECTIONS === 1 ? DIR_NAMES[dir || 0] : QUADRANT_NAMES[dir || 0];
  }

  return { compute, baseConfidence, liveConfidence, quoteQuality, rebuildCoverage, camerasWatchingNode, aimLabel, DIRS, QUADRANT_NAMES, DIR_NAMES };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = { Sightlines };

// ============================================================
// CAMERAS
// ============================================================

// ============================================================
// CAMERAS — placement/relocation/upgrades (the primary verb),
// local drives and the upload cycle (§10.1), degradation.
// A destroyed camera loses everything since its last upload;
// a degraded one keeps reporting, worse (§11.1).
// ============================================================

var CameraSystem = (() => {

  function camAt(state, nodeIdx) {
    return state.cameras.find(c => c.node === nodeIdx) || null;
  }

  function byId(state, id) {
    return state.cameras.find(c => c.id === id) || null;
  }

  function relayAdjacent(state, cam) {
    if (!CONFIG.Retention.RELAY_CONTINUOUS) return false;
    for (const e of state.map.adj[cam.node]) {
      const n = camAt(state, e.node);
      if (n && n.type === 'RELAY') return true;
    }
    return false;
  }

  // ---- Actions (shared verb surface: UI and trial player) ----

  Actions.place = function (state, nodeIdx, type, dir) {
    const spec = CONFIG.Cameras[type];
    if (!spec) return { ok: false, reason: 'NO SUCH UNIT' };
    const node = state.map.nodes[nodeIdx];
    if (!node || !state.map.adj[nodeIdx].length) return { ok: false, reason: 'NO ROAD AT THIS POLE' };
    if (node.exit) return { ok: false, reason: 'CITY LIMITS — NO POLE' };
    if (camAt(state, nodeIdx)) return { ok: false, reason: 'POLE OCCUPIED' };
    if (state.budget < spec.COST) return { ok: false, reason: 'BUDGET SHORT ' + (spec.COST - Math.floor(state.budget)) };
    state.budget -= spec.COST;
    const cam = {
      id: state.nextCamId++, node: nodeIdx, type, dir: dir || 0,
      tags: 0, hardened: false, storageUp: false,
      drive: [],                       // readIds recorded since last upload
      lastUpload: state.time,
      builtAt: state.time
    };
    cam.sight = Sightlines.compute(state.map, nodeIdx, type, cam.dir);
    state.cameras.push(cam);
    if (type !== 'OFFICER') state.stats.built++;   // tours don't count against network integrity
    Sightlines.rebuildCoverage(state);
    State.emit(state, { type: 'placed', camId: cam.id, node: nodeIdx, unit: type });
    return { ok: true, cam };
  };

  // Relocation is the answer to crews learning coverage (§13) — cheap
  // enough to be routine. The unit keeps upgrades; its drive uploads
  // first (the truck takes the disk in).
  Actions.relocate = function (state, camId, nodeIdx, dir) {
    const cam = byId(state, camId);
    if (!cam) return { ok: false, reason: 'NO SUCH UNIT' };
    const node = state.map.nodes[nodeIdx];
    if (!node || !state.map.adj[nodeIdx].length) return { ok: false, reason: 'NO ROAD AT THIS POLE' };
    if (node.exit) return { ok: false, reason: 'CITY LIMITS — NO POLE' };
    if (camAt(state, nodeIdx)) return { ok: false, reason: 'POLE OCCUPIED' };
    const cost = Math.ceil(CONFIG.Cameras[cam.type].COST * CONFIG.Cameras.RELOCATE_COST_FRACTION);
    if (state.budget < cost) return { ok: false, reason: 'BUDGET SHORT ' + (cost - Math.floor(state.budget)) };
    state.budget -= cost;
    upload(state, cam);                // pending footage rides along, not lost
    cam.node = nodeIdx;
    if (dir !== undefined) cam.dir = dir;
    cam.sight = Sightlines.compute(state.map, nodeIdx, cam.type, cam.dir);
    Sightlines.rebuildCoverage(state);
    State.emit(state, { type: 'relocated', camId: cam.id, node: nodeIdx });
    return { ok: true, cam };
  };

  Actions.upgrade = function (state, camId, kind) {
    const cam = byId(state, camId);
    if (!cam) return { ok: false, reason: 'NO SUCH UNIT' };
    if (cam.type === 'OFFICER') return { ok: false, reason: 'THE OFFICER IS FINE' };
    const cost = CONFIG.Upgrades[kind];
    if (cost === undefined) return { ok: false, reason: 'NO SUCH WORK' };
    if (kind === 'HARDEN' && cam.hardened) return { ok: false, reason: 'ALREADY HARDENED' };
    if (kind === 'STORAGE' && cam.storageUp) return { ok: false, reason: 'DRIVE ALREADY FITTED' };
    if (kind === 'CLEAN' && cam.tags === 0) return { ok: false, reason: 'LENS IS CLEAN' };
    if (state.budget < cost) return { ok: false, reason: 'BUDGET SHORT ' + (cost - Math.floor(state.budget)) };
    state.budget -= cost;
    if (kind === 'HARDEN') cam.hardened = true;
    if (kind === 'STORAGE') cam.storageUp = true;
    if (kind === 'CLEAN') cam.tags = 0;
    State.emit(state, { type: 'upgraded', camId: cam.id, kind });
    return { ok: true, cam };
  };

  // ---- reads & drives ----

  // Record a read on this camera's local drive. Attachment to cases is
  // CaseSystem's business; crews learning is CrewSystem's.
  function record(state, cam, read) {
    read.camId = cam.id;
    read.camNode = cam.node;   // where the picture was taken — survives the camera
    read.camType = cam.type;
    read.camTags = cam.tags;   // a fouled lens smears the still it took
    read.rain = state.shift.rainUntil > state.time;  // rain streaks the frame
    read.uploadedAt = null;
    read.lost = false;
    state.reads.push(read);
    if (cam.type === 'OFFICER' || relayAdjacent(state, cam)) {
      read.uploadedAt = state.time;    // eyewitness testimony and relay links file instantly
      read.expiresAt = state.time + retentionWindow(cam);
    } else {
      cam.drive.push(read.id);
    }
    return read;
  }

  function retentionWindow(cam) {
    return CONFIG.Retention.WINDOW_SECONDS + (cam.storageUp ? CONFIG.Retention.STORAGE_UPGRADE_BONUS : 0);
  }

  function upload(state, cam) {
    if (!cam.drive.length) { cam.lastUpload = state.time; return; }
    for (const rid of cam.drive) {
      const r = state.reads[rid - 1];
      if (r && !r.lost) { r.uploadedAt = state.time; r.expiresAt = state.time + retentionWindow(cam); }
    }
    cam.drive.length = 0;
    cam.lastUpload = state.time;
    state.stats.uploads++;
    State.emit(state, { type: 'upload', camId: cam.id });
  }

  // Destruction: the freshest consequence in the design — retroactive
  // evidence loss (§10.1). Pending reads evaporate.
  function destroy(state, cam, byVandalId) {
    let lost = 0;
    for (const rid of cam.drive) {
      const r = state.reads[rid - 1];
      if (r && r.uploadedAt === null) { r.lost = true; lost++; }
    }
    state.stats.dataLostReads += lost;
    state.cameras = state.cameras.filter(c => c.id !== cam.id);
    state.stats.destroyed++;
    Sightlines.rebuildCoverage(state);
    State.emit(state, { type: 'destroyed', camId: cam.id, node: cam.node, lostReads: lost, byVandalId });
    if (lost > 0) {
      State.log(state, 'Pole down. ' + lost + ' unsent read' + (lost === 1 ? '' : 's') + ' gone with it.', null);
      State.emit(state, { type: 'dataLost', camId: cam.id, node: cam.node, count: lost });
    } else {
      State.log(state, 'Pole down at intersection ' + cam.node + '.', null);
    }
    return lost;
  }

  function tick(state, dt) {
    for (const cam of state.cameras) {
      if (state.time - cam.lastUpload >= CONFIG.Retention.UPLOAD_INTERVAL) upload(state, cam);
    }
    // officers rotate off when the tour ends — nothing is lost (their
    // testimony filed instantly), the corner just goes dark again
    const expired = state.cameras.filter(c =>
      c.type === 'OFFICER' && state.time - c.builtAt >= CONFIG.Cameras.OFFICER.TOUR_SECONDS);
    if (expired.length) {
      state.cameras = state.cameras.filter(c => !expired.includes(c));
      Sightlines.rebuildCoverage(state);
      for (const c of expired) {
        State.emit(state, { type: 'officerOff', node: c.node });
        State.log(state, 'Tour over — the officer at intersection ' + c.node + ' rotated off.', 'first-officer-off');
      }
    }
  }

  return { camAt, byId, record, upload, destroy, tick, relayAdjacent, retentionWindow };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = { CameraSystem };

// ============================================================
// TRAFFIC
// ============================================================

// ============================================================
// TRAFFIC — ambient vehicles and suspect escape runs. Route
// choice is the entire suspect behaviour (§20.1): no evasion
// beyond it. Reads happen as vehicles complete segments inside
// sightlines.
// ============================================================

var Traffic = (() => {

  function segSeconds(state, segId) {
    const s = state.map.segs[segId];
    return CONFIG.Grid.SEGMENT_SECONDS / (s.arterial ? CONFIG.Grid.ARTERIAL_SPEED_MULT : 1);
  }

  // Max speed any vehicle can move, in segments/second — the coherence
  // check (§8.2) uses this to decide whether two reads can be one car.
  function maxSegPerSec() {
    return CONFIG.Grid.ARTERIAL_SPEED_MULT / CONFIG.Grid.SEGMENT_SECONDS;
  }

  // Dijkstra with a per-segment weight function; returns node path.
  function route(state, from, to, weightFn) {
    const N = state.map.nodes.length;
    const dist = new Array(N).fill(Infinity);
    const prev = new Array(N).fill(-1);
    const done = new Array(N).fill(false);
    dist[from] = 0;
    for (;;) {
      let u = -1, best = Infinity;
      for (let i = 0; i < N; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
      if (u === -1 || u === to) break;
      done[u] = true;
      for (const e of state.map.adj[u]) {
        const w = weightFn ? weightFn(e.seg) : 1;
        if (dist[u] + w < dist[e.node]) { dist[e.node] = dist[u] + w; prev[e.node] = u; }
      }
    }
    if (dist[to] === Infinity) return null;
    const path = [to];
    let n = to;
    while (n !== from) { n = prev[n]; path.push(n); }
    path.reverse();
    return path;
  }

  function spawnVehicle(state, kind, from, to, crewId, caseId, plate) {
    const crew = crewId ? state.crews[crewId] : null;
    const weightFn = crew ? CrewSystem.routeWeightFn(state, crew) : null;
    const path = route(state, from, to, weightFn);
    if (!path || path.length < 2) return null;
    const veh = {
      id: state.nextVehId++, kind, plate,
      crewId: crewId || null, caseId: caseId || null,
      path, at: 0, segT: 0, done: false
    };
    state.vehicles.push(veh);
    // Visible learning (§13.2): if avoidance bent this route, show it.
    if (crew && crew.activeKnown.length) {
      const straight = route(state, from, to, null);
      if (straight && straight.length !== path.length) {
        state.stats.reroutes++;
        State.emit(state, { type: 'reroute', vehId: veh.id, path: path.slice(), avoided: crew.activeKnown.slice() });
        State.log(state, "They've made the pole. They're going around.", 'first-reroute');
      }
    }
    return veh;
  }

  function currentSeg(state, veh) {
    if (veh.at + 1 >= veh.path.length) return -1;
    const a = veh.path[veh.at], b = veh.path[veh.at + 1];
    for (const e of state.map.adj[a]) if (e.node === b) return e.seg;
    return -1;
  }

  // A vehicle finished a segment: every camera sighting that segment
  // takes a picture. The read exists whether or not it qualifies —
  // below-threshold reads are the *visibly missed* grey flashes (§18).
  function readsOnSegment(state, veh, segId) {
    const cams = state.covSegs.get(segId);
    if (!cams) return;
    for (const camId of cams) {
      const cam = CameraSystem.byId(state, camId);
      if (!cam) continue;
      const entry = cam.sight.find(e => e.seg === segId);
      if (!entry) continue;
      // one read per camera per pass (player-directed): tracking a car
      // takes multiple cameras, not one pole triple-dipping
      if (!veh._lastReadBy) veh._lastReadBy = {};
      if (state.time - (veh._lastReadBy[camId] || -Infinity) < CONFIG.Confidence.PER_VEHICLE_COOLDOWN) continue;
      veh._lastReadBy[camId] = state.time;
      const conf = Sightlines.liveConfidence(state, cam, entry);
      const a = state.map.nodes[veh.path[veh.at - 1]], b = state.map.nodes[veh.path[veh.at]];
      const heading = a && b ? (b.x > a.x ? 0 : b.y > a.y ? 1 : b.x < a.x ? 2 : 3) : 0; // E S W N
      const read = {
        id: state.nextReadId++, t: state.time, segId, vehId: veh.id,
        crewId: veh.crewId, heading,
        actualPlate: veh.plate, plate: veh.plate,
        trueMatch: false, conf, qualifying: conf >= state.threshold,
        caseId: null
      };
      state.stats.reads++;
      CaseSystem.attachRead(state, read, veh, cam);
      CameraSystem.record(state, cam, read);
      if (veh.crewId) CrewSystem.sighted(state, veh.crewId, cam.id);
      State.emit(state, {
        type: 'read', segId, camId: cam.id, conf, qualifying: read.qualifying,
        attached: read.caseId !== null, plate: read.plate, dim: cam.tags > 0
      });
      if (read.qualifying) state.stats.qualifying++;
    }
  }

  // Ambient traffic enters from the city limits and drives THROUGH
  // (player-directed): cars never pop into existence mid-map.
  function pickAmbientTrip(state) {
    const rng = () => State.rngNext(state, 'traffic');
    const exits = state.map.exits;
    if (exits.length < 2) return null;
    const from = exits[Math.floor(rng() * exits.length)];
    let to = exits[Math.floor(rng() * exits.length)];
    if (to === from) to = exits[(exits.indexOf(from) + 1) % exits.length];
    return { from, to };
  }

  function ambientTarget(state) {
    const per30 = CONFIG.Traffic.AMBIENT_PER_30_NODES;
    const n = Math.round(state.map.nodes.length / 30 * per30);
    return Math.min(CONFIG.Traffic.AMBIENT_MAX, n);
  }

  function tick(state, dt) {
    // full streets from the first frame (player-directed)
    if (CONFIG.Traffic.PREFILL && !state._prefilled) {
      state._prefilled = true;
      const want = ambientTarget(state);
      for (let i = 0; i < want; i++) {
        const trip = pickAmbientTrip(state);
        if (trip) {
          const veh = spawnVehicle(state, 'AMBIENT', trip.from, trip.to, null, null,
            makePlate(() => State.rngNext(state, 'plates')));
          // scatter them along their routes so the city starts mid-motion
          if (veh) veh.at = Math.floor(State.rngNext(state, 'traffic') * Math.max(1, veh.path.length - 2));
        }
      }
    }
    // keep ambient population up
    const ambient = state.vehicles.filter(v => v.kind === 'AMBIENT' && !v.done).length;
    if (ambient < ambientTarget(state)) {
      if (!state._nextAmbientAt || state.time >= state._nextAmbientAt) {
        const trip = pickAmbientTrip(state);
        if (trip) {
          spawnVehicle(state, 'AMBIENT', trip.from, trip.to, null, null,
            makePlate(() => State.rngNext(state, 'plates')));
        }
        state._nextAmbientAt = state.time + CONFIG.Traffic.SPAWN_INTERVAL;
      }
    }

    for (const veh of state.vehicles) {
      if (veh.done) continue;
      const segId = currentSeg(state, veh);
      if (segId < 0) { veh.done = true; continue; }
      veh.segT += dt / segSeconds(state, segId);
      if (veh.segT >= 1) {
        veh.segT = 0;
        veh.at++;
        readsOnSegment(state, veh, segId);
        if (veh.at + 1 >= veh.path.length) {
          veh.done = true;
          State.emit(state, { type: 'exited', vehId: veh.id, kind: veh.kind });
        }
      }
    }
    // compact finished vehicles occasionally
    if (state.vehicles.length > 60) state.vehicles = state.vehicles.filter(v => !v.done);
  }

  return { tick, spawnVehicle, route, maxSegPerSec, segSeconds };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = { Traffic };

// ============================================================
// CASES
// ============================================================

// ============================================================
// CASES — crimes open cases; qualifying reads become evidence
// after upload; three corroborating reads on a coherent route
// close a case (§8). Contradictions flag contested — never a
// silent wrong closure; that invariant is proven by
// test_coherence.js on every build.
// ============================================================

var CaseSystem = (() => {

  function byId(state, id) {
    return state.cases.find(c => c.id === id) || null;
  }

  // BFS hop distance between two nodes, cached per source node.
  function nodeDist(state, a, b) {
    if (!state.map._distCache) state.map._distCache = new Map();
    let d = state.map._distCache.get(a);
    if (!d) { d = MapGen.bfsMulti(state.map, [a]); state.map._distCache.set(a, d); }
    return d[b];
  }

  function camNode(state, read) {
    if (read.camNode !== undefined) return read.camNode;
    const s = state.map.segs[read.segId];
    return s.a;
  }

  // Two reads are consistent with one vehicle's travel iff the gap in
  // space is coverable in the gap in time at the fastest road speed,
  // plus a slack (§8.2). Same camera never contradicts itself.
  function pairCoherent(state, r1, r2) {
    const dt = Math.abs(r1.t - r2.t);
    const dd = nodeDist(state, camNode(state, r1), camNode(state, r2));
    return dd <= dt * Traffic.maxSegPerSec() + CONFIG.Cases.COHERENCE_SLACK_SEGS;
  }

  // Usable evidence right now: qualifying, attached, uploaded, not lost,
  // not expired.
  function usableEvidence(state, kase) {
    const out = [];
    for (const r of state.reads) {
      if (r.caseId !== kase.id || r.lost || r.uploadedAt === null || r.dismissed) continue;
      if (state.time >= r.expiresAt) continue;
      out.push(r);
    }
    return out;
  }

  // The analyst can pull an irrelevant frame from a file (player-directed):
  // excising a poisoned frame can clean a contested file and let a track
  // close — and excising your own true frames is a new way to be wrong.
  Actions.dismissRead = function (state, caseId, readId) {
    const kase = byId(state, caseId);
    if (!kase) return { ok: false, reason: 'NO SUCH CASE' };
    if (kase.status !== 'OPEN' && kase.status !== 'CONTESTED') return { ok: false, reason: 'FILE NOT WORKABLE' };
    const read = state.reads[readId - 1];
    if (!read || read.caseId !== kase.id) return { ok: false, reason: 'NOT IN THIS FILE' };
    read.dismissed = !read.dismissed;   // a toggle — pulled frames can come back
    state.stats.dismissed = (state.stats.dismissed || 0) + (read.dismissed ? 1 : -1);
    State.emit(state, { type: 'frameDismissed', caseId: kase.id, readId, dismissed: read.dismissed });
    if (read.dismissed) State.log(state, 'Frame pulled from the file. Tap it again to restore.', 'first-dismiss');
    // a cleaned contested file may go back to quietly building
    if (kase.status === 'CONTESTED') {
      const g = grade(state, usableEvidence(state, kase), gradeOpts(kase));
      const S = CONFIG.Cases.CLOSURE_CONFIDENCE_SUM;
      const tier = CONFIG.Ladder.TIERS[state.ladder.tier] || CONFIG.Ladder.TIERS[1];
      const band = CONFIG.Cases.CONTESTED_BAND * (tier.contestedMult || 1);
      const nearBar = g.best && g.bestSum >= S - band && g.bestSum < S;
      if (!g.contradiction && !nearBar) {
        kase.status = 'OPEN';
        kase.contested = null;
        State.log(state, 'File cleaned up — case building again.', null);
      }
    }
    return { ok: true };
  };

  // Which pairs of reads cannot be one vehicle — the evidence sheet marks
  // these so the player can see WHERE the file's story breaks.
  function contradictionPairs(state, evidence) {
    const pairs = [];
    for (let i = 0; i < evidence.length; i++) {
      for (let j = i + 1; j < evidence.length; j++) {
        if (!pairCoherent(state, evidence[i], evidence[j])) pairs.push([evidence[i].id, evidence[j].id]);
      }
    }
    return pairs;
  }

  // Best coherent triple by confidence sum; also reports whether any
  // contradictory pair exists in the evidence set. A valid triple is a
  // TRACK (player-directed): it spans distinct cameras, and its earliest
  // read comes from near the scene — picked up where it happened,
  // followed across the city, taken down at the last pole.
  function grade(state, evidence, opts) {
    opts = opts || {};
    const K = CONFIG.Cases.READS_TO_CLOSE;
    const minCams = opts.minCams !== undefined ? opts.minCams : CONFIG.Cases.MIN_TRACK_CAMS;
    const E = evidence.slice().sort((a, b) => b.conf - a.conf).slice(0, 10);
    let contradiction = false;
    for (let i = 0; i < E.length; i++) for (let j = i + 1; j < E.length; j++) {
      if (!pairCoherent(state, E[i], E[j])) { contradiction = true; }
    }
    let best = null, bestSum = -1;
    if (E.length >= K) {
      const idx = [];
      const pick = (start) => {
        if (idx.length === K) {
          const triple = idx.map(i => E[i]).sort((a, b) => a.t - b.t);
          for (let i = 0; i + 1 < triple.length; i++) {
            if (!pairCoherent(state, triple[i], triple[i + 1])) return;
          }
          if (!pairCoherent(state, triple[0], triple[triple.length - 1])) return;
          if (new Set(triple.map(r => r.camId)).size < minCams) return;
          if (opts.anchorNode !== undefined &&
              nodeDist(state, camNode(state, triple[0]), opts.anchorNode) > CONFIG.Cases.ANCHOR_DIST) return;
          const sum = triple.reduce((s, r) => s + r.conf, 0);
          if (sum > bestSum) { bestSum = sum; best = triple; }
          return;
        }
        for (let i = start; i < E.length; i++) { idx.push(i); pick(i + 1); idx.pop(); }
      };
      pick(0);
    }
    return { best, bestSum, contradiction, count: evidence.length };
  }

  // grading options for a case: vandal files are one witnessed scene,
  // everything else must be a cross-town track anchored at the crime
  function gradeOpts(kase) {
    return kase.type === 'VANDAL' ? { minCams: 1 } : { anchorNode: kase.spawnNode };
  }

  // ---- crimes ----

  // Specific crimes at recognisable places (player-directed): the kind
  // and the landmark come from where it happened, and the tip line says
  // what the witness actually saw.
  const PETTY_KINDS = {
    HOUSES: ['BREAK-IN', 'THE ROW HOUSES'],
    APARTMENTS: ['MUGGING', 'THE APARTMENTS'],
    DOWNTOWN: ['CAR THEFT', 'DOWNTOWN'],
    SYNDICATE: ['SHAKEDOWN', 'THE SYNDICATE BLOCK'],
    BANK: ['PURSE SNATCHING', 'THE BANK STEPS'],
    OFFICE: ['SMASH-AND-GRAB', 'THE OFFICE TOWER'],
    GROCERY: ['SHOPLIFTING', 'THE GROCERY STORE']
  };
  const TIP_VERBS = {
    'BANK ROBBERY': 'rob', 'OFFICE BURGLARY': 'hit', 'ARMED ROBBERY': 'hold up',
    'SHOPLIFTING': 'run from', 'MUGGING': 'flee', 'BREAK-IN': 'leave',
    'CAR THEFT': 'boost a car near', 'SHAKEDOWN': 'work', 'PURSE SNATCHING': 'strike at',
    'SMASH-AND-GRAB': 'hit', 'SYNDICATE HEIST': 'clean out'
  };

  function openCrime(state, type) {
    const rng = () => State.rngNext(state, 'crimes');
    let spawnNode, kind, landmark;
    if (type === 'SYNDICATE') {
      spawnNode = state.map.syndicate;
      kind = 'SYNDICATE HEIST'; landmark = 'THE SYNDICATE BLOCK';
    } else if (type === 'MAJOR') {
      const r = rng();
      const pick = r < 0.4 ? ['BANK', 'BANK ROBBERY', 'THE BANK']
        : r < 0.7 ? ['OFFICE', 'OFFICE BURGLARY', 'THE OFFICE TOWER']
        : ['GROCERY', 'ARMED ROBBERY', 'THE GROCERY STORE'];
      spawnNode = state.map.poi[pick[0]];
      kind = pick[1]; landmark = pick[2];
    } else {
      const zones = state.map.spawnZones;
      spawnNode = zones[Math.floor(rng() * zones.length)];
      const district = state.map.districts[spawnNode] || 'HOUSES';
      const k = PETTY_KINDS[district] || ['THEFT', 'THE ' + district];
      kind = k[0]; landmark = k[1];
    }
    const crewId = type === 'SYNDICATE' ? 'syndicate'
      : type === 'MAJOR' ? 'major-a'
      : (rng() < 0.5 ? 'petty-a' : 'petty-b');
    const crew = state.crews[crewId];
    state.stats.crimes++;

    // Syndicate continuity: the crew keeps its plate, and a still-open
    // syndicate case absorbs the new job's reads — this is what makes
    // the shift-5 recovery possible (§14.4).
    let kase = null;
    if (type === 'SYNDICATE') {
      kase = state.cases.find(c => c.crewId === 'syndicate' && (c.status === 'OPEN' || c.status === 'CONTESTED'));
    }
    if (!kase) {
      if (!crew.plate || type !== 'SYNDICATE') crew.plate = makePlate(() => State.rngNext(state, 'plates'));
      if (type === 'SYNDICATE' && !crew.plate) crew.plate = makePlate(() => State.rngNext(state, 'plates'));
      // some witnesses catch no plate (player-directed): the file opens on
      // the description alone and cannot be tracked, arrested or charged
      // until the analyst ties it to a candidate car
      const unidentified = type !== 'SYNDICATE' &&
        State.rngNext(state, 'crimes') < CONFIG.Cases.UNIDENTIFIED_CHANCE;
      kase = {
        id: state.nextCaseId++, type,
        truePlate: crew.plate,
        plate: unidentified ? null : crew.plate,
        crewId,
        kind, landmark,
        spawnNode, openedAt: state.time,
        coldAt: state.time + CONFIG.Cases.LIFETIME_SECONDS,
        status: 'OPEN', riskAnnounced: false, atRiskUntil: 0,
        closedTriple: null, falseCharge: false, contested: null,
        _peakUsable: 0
      };
      // the witness saw the actual car — usually well, sometimes vaguely
      kase.witnessDesc = witnessDescription(carIdentity(kase.truePlate),
        State.rngNext(state, 'witness'), State.rngNext(state, 'witness'));
      state.cases.push(kase);
      if (kase.plate === null) {
        State.log(state, 'No plate on the file — just "a ' + kase.witnessDesc + '". Candidates will collect on the card.', 'first-unidentified');
      }
    }

    // choose exit weighted toward nearer ones
    const exits = state.map.exits;
    const weights = exits.map(e => 1 / (1 + nodeDist(state, spawnNode, e)));
    const exit = exits[weightedIndex(weights, rng())];
    const veh = Traffic.spawnVehicle(state, 'SUSPECT', spawnNode, exit, crewId, kase.id, kase.truePlate || kase.plate);

    State.emit(state, { type: 'crime', crimeType: type, node: spawnNode, caseId: kase.id, kind });
    // every reported crime rings the tip line (player-directed) with what
    // the witness actually saw; high trust gets zones flagged EARLY at the
    // telegraph, before the car moves
    state.stats.tips++;
    const verb = TIP_VERBS[kind] || 'flee';
    State.emit(state, {
      type: 'tip', node: spawnNode, caseId: kase.id, early: false,
      bubble: 'Saw a ' + kase.witnessDesc + '\n' + verb + ' ' + landmark + '!'
    });
    State.log(state, 'Tip line: saw a ' + kase.witnessDesc + ' ' + verb + ' ' + landmark + '!', null);
    return kase;
  }

  // ---- read attachment (called by Traffic and Vandals) ----

  // Unidentified files collect CANDIDATES instead of evidence: any
  // clearly-photographed car matching the witness description near the
  // scene joins the lineup, capped, until the analyst ties the file.
  function candidateScan(state, read) {
    const s = state.map.segs[read.segId];
    for (const kase of state.cases) {
      if (kase.plate !== null) continue;
      if (kase.status !== 'OPEN' || state.time >= kase.coldAt) continue;
      const d = Math.min(nodeDist(state, s.a, kase.spawnNode), nodeDist(state, s.b, kase.spawnNode));
      if (d > CONFIG.Cases.CANDIDATE_DIST) continue;
      if (!descriptionMatches(kase.witnessDesc, carIdentity(read.actualPlate))) continue;
      if (!kase._candPlates) kase._candPlates = {};
      const isNew = !kase._candPlates[read.actualPlate];
      if (isNew && Object.keys(kase._candPlates).length >= CONFIG.Cases.CANDIDATE_MAX) continue;
      kase._candPlates[read.actualPlate] = true;
      read.candidateOf = kase.id;
      kase._leads = (kase._leads || 0) + 1;
      if (isNew) State.emit(state, { type: 'candidate', caseId: kase.id, plate: read.actualPlate });
      return;   // a frame joins one lineup
    }
  }

  function attachRead(state, read, veh, cam) {
    if (!read.qualifying) return;     // below the bar: never enters a file (§7)
    if (veh && veh.caseId !== null) {
      const kase = byId(state, veh.caseId);
      // a tied file only accepts reads of ITS plate — if you tied it to
      // the wrong car, the real crew's reads no longer help you
      if (kase && kase.plate !== null && veh.plate === kase.plate &&
          (kase.status === 'OPEN' || kase.status === 'CONTESTED') && state.time < kase.coldAt) {
        read.caseId = kase.id;
        read.trueMatch = read.actualPlate === kase.truePlate;
        read.plate = kase.plate;
        kase._leads = (kase._leads || 0) + 1;
        return;
      }
      candidateScan(state, read);   // its own file untied (or gone): the lineup may still want this frame
      return;
    }
    candidateScan(state, read);
    if (read.candidateOf !== undefined) return;
    // Ambient vehicle. A clean read identifies an uninvolved plate and is
    // discarded; an ambiguous one (below CLARITY) can misattach to the
    // nearest open case — §7.1's trap, priced by the threshold. How often
    // an ambiguous plate happens to resemble a suspect's scales with how
    // ambiguous the read is: a lax bar admits liars, a strict one rarely.
    const C = CONFIG.Confidence;
    if (read.conf >= C.CLARITY) return;
    const p = C.MISREAD_BASE * (C.CLARITY - read.conf) / C.CLARITY;
    if (State.rngNext(state, 'misread') >= p) return;
    let best = null, bestD = Infinity;
    const s = state.map.segs[read.segId];
    for (const kase of state.cases) {
      if (kase.status !== 'OPEN' && kase.status !== 'CONTESTED') continue;
      if (kase.type === 'VANDAL' || kase.plate === null) continue;
      if (state.time >= kase.coldAt) continue;
      const d = Math.min(nodeDist(state, s.a, kase.spawnNode), nodeDist(state, s.b, kase.spawnNode));
      if (d < bestD) { bestD = d; best = kase; }
    }
    if (bestD > C.MISREAD_MAX_DIST) return;
    if (best) {
      read.caseId = best.id;
      read.trueMatch = false;
      read.plate = best.plate;        // the misread "looks like" the suspect plate
      best._leads = (best._leads || 0) + 1;
      state.stats.falseAttached++;
    }
  }

  // ---- closure / contested / cold ----

  function payout(state, kase) {
    const E = CONFIG.Economy;
    let pay = kase.type === 'SYNDICATE' ? E.PAYOUT_SYNDICATE
      : kase.type === 'MAJOR' ? E.PAYOUT_MAJOR
      : kase.type === 'VANDAL' ? 0
      : E.PAYOUT_PETTY;
    if (state.trust < E.LOW_TRUST_AT) pay *= E.LOW_TRUST_PAYOUT_MULT;
    return pay;
  }

  // The pipeline (player-directed): corroborate → ARREST → conviction.
  // Corroboration makes the arrest; the file must then survive to trial —
  // evidence that ages off the drives before conviction collapses in court.
  function close(state, kase, triple, via) {
    kase.status = 'ARREST';
    kase.via = via || 'auto';
    kase.closedAt = state.time;
    kase.convictAt = state.time + CONFIG.Cases.CONVICTION_DELAY;
    kase.closedTriple = (triple || []).map(r => r.id);
    const falseCount = (triple || []).filter(r => !r.trueMatch).length;
    kase.falseCharge = falseCount >= CONFIG.Cases.FALSE_MAJORITY;
    state.clrClosed += 1;                  // the arrest is what clearance counts
    state.stats.closures++;
    // the last read in the track is where they're taken down
    const last = (triple || []).slice().sort((a, b) => a.t - b.t).pop();
    kase.arrestNode = last ? camNode(state, last) : kase.spawnNode;
    const where = state.map.districts ? state.map.districts[kase.arrestNode] : null;
    const PHRASE = { DOWNTOWN: 'downtown', APARTMENTS: 'by the apartments', HOUSES: 'in the row houses',
      BANK: 'outside the bank', OFFICE: 'by the office tower', GROCERY: 'at the grocery store',
      SYNDICATE: 'on the syndicate block' };
    State.emit(state, { type: 'arrest', caseId: kase.id, via: kase.via, node: kase.arrestNode });
    State.log(state, 'Tracked and taken down ' + (PHRASE[where] || 'mid-route') + ' — ' + kase.plate + '.', null);

    // an arrest takes the vandal crew off the board immediately
    if (kase.type === 'VANDAL') {
      const crew = state.crews[kase.crewId];
      if (crew) {
        crew.caught = true;
        for (const v of state.vandals) if (v.crewId === crew.id) v.state = 'CAUGHT';
      }
    }
  }

  function resolveConviction(state, kase) {
    const E = CONFIG.Economy;
    kase.status = 'CLOSED';
    const triple = (kase.closedTriple || []).map(id => state.reads[id - 1]).filter(Boolean);
    // the file must still stand up: enough of the closing reads unexpired
    const alive = triple.filter(r => !r.lost && r.expiresAt !== undefined && state.time < r.expiresAt).length;
    kase.collapsed = alive < CONFIG.Cases.READS_TO_CLOSE - 1;

    if (kase.falseCharge) {
      // the trap (§7.1): the wrongful conviction still pays
      state.budget += payout(state, kase);
      state.trust = Math.max(0, state.trust - E.TRUST_LOSS_FALSE_CHARGE);
      state.stats.falseCharges++;
      state.falseChargesThisShift++;
      const wrong = triple.find(r => !r.trueMatch);
      State.emit(state, { type: 'falseCharge', caseId: kase.id, actualPlate: wrong ? wrong.actualPlate : '?' });
      State.log(state, 'Wrong plate convicted. The crew is still out there.', 'first-false-charge');
      State.log(state, 'Convicted ' + kase.plate + ' — the reads were of ' + (wrong ? wrong.actualPlate : 'another car') + '.', null);
      return;
    }
    if (kase.collapsed) {
      state.budget += payout(state, kase) * E.COLLAPSE_PAYOUT_MULT;
      State.emit(state, { type: 'caseCollapsed', caseId: kase.id });
      State.log(state, 'The footage aged out before trial. Case collapsed in court.', 'first-collapse');
      return;
    }
    state.budget += payout(state, kase);
    State.emit(state, { type: 'caseClosed', caseId: kase.id, via: kase.via });
    State.log(state, 'Conviction — ' + kase.plate + '.', 'first-conviction');
    if (kase.type === 'SYNDICATE') {
      state.warrant = Math.min(CONFIG.Warrant.REQUIRED, state.warrant + CONFIG.Warrant.PER_CASE);
      State.emit(state, { type: 'warrant', value: state.warrant });
      State.log(state, 'Syndicate conviction. Warrant at ' + Math.round(state.warrant) + '%.', null);
    }
    if (kase.type === 'VANDAL') {
      const crew = state.crews[kase.crewId];
      if (crew) {
        const bounty = Math.round(crew.damage * CONFIG.Vandals.CREW_CASE_BOUNTY_MULT);
        state.budget += bounty;
        state.stats.bounties++;
        State.log(state, 'Vandal crew convicted. Recovered ' + bounty + '.', null);
      }
    }
  }

  // Clearance judges the cases you ENGAGED (player-directed rebalance for
  // the tracking era): a file with zero qualifying reads lapses quietly —
  // the city is bigger than the network, and that is not the analyst's
  // failure. Losing a lead you HAD still costs.
  function goCold(state, kase, reason) {
    // the "city is bigger than the network" mercy requires HAVING a
    // network: with no working cameras, every cold crime is on you —
    // which is also what lets a refused Review still end (§16.1)
    const hasNetwork = state.cameras.some(c => c.type !== 'RELAY');
    const engaged = !hasNetwork ||
      (kase._leads || 0) >= CONFIG.Cases.ENGAGED_AT || kase.status === 'CONTESTED';
    if (!engaged) {
      kase.status = 'LAPSED';
      state.stats.lapsed = (state.stats.lapsed || 0) + 1;
      State.emit(state, { type: 'caseCold', caseId: kase.id, reason: 'no-leads' });
      return;
    }
    kase.status = 'COLD';
    state.clrCold += 1;
    state.stats.colds++;
    State.emit(state, { type: 'caseCold', caseId: kase.id, reason: reason || 'expired' });
  }

  // ---- the adjudication verb (§9) ----

  Actions.adjudicate = function (state, caseId, choice) {
    const kase = byId(state, caseId);
    if (!kase) return { ok: false, reason: 'NO SUCH CASE' };
    if (kase.status !== 'CONTESTED') return { ok: false, reason: 'NOT CONTESTED' };
    const ev = usableEvidence(state, kase);
    const g = grade(state, ev, gradeOpts(kase));
    const graded = g.best || ev.slice().sort((a, b) => b.conf - a.conf).slice(0, CONFIG.Cases.READS_TO_CLOSE);
    const majorityTrue = graded.filter(r => r.trueMatch).length > graded.length / 2;
    state.stats.contestedResolved++;

    if (choice === 'CHARGE') {
      close(state, kase, graded, 'charge');
    } else if (choice === 'RELEASE') {
      if (majorityTrue) {
        goCold(state, kase, 'released');   // the real crew walks: clearance pays
      } else {
        kase.status = 'RELEASED';           // nothing lost, small trust gain
        state.trust = Math.min(100, state.trust + CONFIG.Economy.TRUST_GAIN_CORRECT_RELEASE);
        State.emit(state, { type: 'released', caseId: kase.id, correct: true });
      }
    } else return { ok: false, reason: 'CHARGE OR RELEASE' };
    return { ok: true, kase };
  };

  // Tie an unidentified file to a candidate car (player-directed): its
  // lineup frames become evidence, and from here the normal track →
  // arrest → charge pipeline applies. Tie it to the wrong car and the
  // real crew's reads stop helping you — the deepest trap in the game.
  Actions.identify = function (state, caseId, plate) {
    const kase = byId(state, caseId);
    if (!kase) return { ok: false, reason: 'NO SUCH CASE' };
    if (kase.plate !== null) return { ok: false, reason: 'FILE ALREADY TIED' };
    if (kase.status !== 'OPEN') return { ok: false, reason: 'FILE NOT OPEN' };
    if (!kase._candPlates || !kase._candPlates[plate]) return { ok: false, reason: 'NOT IN THE LINEUP' };
    kase.plate = plate;
    let attached = 0;
    for (const r of state.reads) {
      if (r.candidateOf !== kase.id) continue;
      if (r.actualPlate === plate) {
        r.caseId = kase.id;
        r.plate = plate;
        r.trueMatch = r.actualPlate === kase.truePlate;
        delete r.candidateOf;
        attached++;
      } else {
        delete r.candidateOf;   // the rest of the lineup goes home
      }
    }
    // the clock restarts where the investigation properly begins
    kase.coldAt = Math.max(kase.coldAt, state.time + CONFIG.Cases.LIFETIME_SECONDS * CONFIG.Cases.IDENTIFY_EXTEND);
    state.stats.identified = (state.stats.identified || 0) + 1;
    State.emit(state, { type: 'identified', caseId: kase.id, plate, frames: attached });
    State.log(state, 'File tied to ' + plate + '. Track it, and the arrest can follow.', 'first-identified');
    return { ok: true, attached };
  };

  Actions.setThreshold = function (state, v) {
    const T = CONFIG.Threshold;
    const nv = clamp(Math.round(v), T.MIN, T.MAX);
    if (nv === state.threshold) return { ok: true, unchanged: true };
    state.threshold = nv;
    State.emit(state, { type: 'threshold', value: nv, band: State.thresholdBand(state) });
    return { ok: true };
  };

  // ---- per-tick lifecycle ----

  function tick(state, dt) {
    for (const kase of state.cases) {
      if (kase.status === 'ARREST' && state.time >= kase.convictAt) resolveConviction(state, kase);
      if (kase.status !== 'OPEN' && kase.status !== 'CONTESTED') continue;

      // the suspect drives again mid-lifetime (player-directed tracking):
      // one crime is one pass; the second sighting is what lets two
      // cameras build a cross-town track. Syndicate re-runs via its
      // repeat jobs; vandal scenes don't drive.
      if (kase.type !== 'VANDAL' && kase.type !== 'SYNDICATE' && !kase._secondRun &&
          state.time >= kase.openedAt + CONFIG.Cases.LIFETIME_SECONDS * CONFIG.Cases.SECOND_RUN_AT) {
        kase._secondRun = true;
        const exits = state.map.exits;
        const exit = exits[Math.floor(State.rngNext(state, 'crimes') * exits.length)];
        const veh = Traffic.spawnVehicle(state, 'SUSPECT', kase.spawnNode, exit, kase.crewId, kase.id, kase.truePlate || kase.plate);
        if (veh) {
          State.emit(state, {
            type: 'tip', node: kase.spawnNode, caseId: kase.id, early: false,
            bubble: 'Seen again —\na ' + (kase.witnessDesc || kase.plate) + '!'
          });
          State.log(state, 'Seen again near ' + (kase.landmark || 'the scene') + ' — ' + (kase.witnessDesc || kase.plate) + '.', null);
        }
      }
      const ev = usableEvidence(state, kase);

      // §14.4: evidence loss makes the wall visible
      if (ev.length < kase._peakUsable && !kase.riskAnnounced && ev.length < CONFIG.Cases.READS_TO_CLOSE) {
        const lost = state.reads.some(r => r.caseId === kase.id && r.lost);
        if (lost) {
          kase.riskAnnounced = true;
          State.emit(state, { type: 'caseAtRisk', caseId: kase.id, coldAt: kase.coldAt });
          State.log(state, 'CASE AT RISK — evidence lost, file expires in ' + Math.max(0, Math.round(kase.coldAt - state.time)) + 's.', null);
        }
      }
      kase._peakUsable = Math.max(kase._peakUsable, ev.length);

      // §10.4 floor valve: evidence near expiry glows on the card
      for (const r of ev) {
        if (r.expiresAt - state.time < CONFIG.Cases.STARVATION_GRACE && !r._glowed) {
          r._glowed = true;
          State.emit(state, { type: 'evidenceExpiring', caseId: kase.id, readId: r.id });
        }
      }

      const g = grade(state, ev, gradeOpts(kase));
      const S = CONFIG.Cases.CLOSURE_CONFIDENCE_SUM;

      if (kase.status === 'OPEN') {
        if (g.best && g.bestSum >= S && !g.contradiction) {
          close(state, kase, g.best, 'auto');
          continue;
        }
        const tier = CONFIG.Ladder.TIERS[state.ladder.tier] || CONFIG.Ladder.TIERS[1];
        const band = CONFIG.Cases.CONTESTED_BAND * (tier.contestedMult || 1);
        const nearBar = g.best && g.bestSum >= S - band && g.bestSum < S;
        const contested = (g.contradiction && ev.length >= 2) || nearBar;
        if (contested && state.contestedThisShift < CONFIG.Cases.CONTESTED_PER_SHIFT_MAX) {
          kase.status = 'CONTESTED';
          state.contestedThisShift++;
          state.stats.contestedShown++;
          kase.contested = { at: state.time, reads: ev.length, contradiction: g.contradiction, nearBar: !!nearBar };
          State.emit(state, { type: 'contested', caseId: kase.id });
          State.log(state, 'Contested case. Open the card and read the stills before you rule.', 'first-contested');
        }
      } else if (kase.status === 'CONTESTED') {
        // a contested case that accumulates clean closure evidence still
        // needs the player's call — the card is already on the table
        if (g.best && g.bestSum >= S && !g.contradiction && !g.best.some(r => !r.trueMatch)) {
          // fully clean file resolves itself; the card withdraws
          close(state, kase, g.best, 'auto');
          continue;
        }
      }

      if (state.time >= kase.coldAt) {
        if (kase.status === 'CONTESTED') {
          // cards never softlock (§9.1): unattended card auto-releases
          state.stats.autoReleased++;
          goCold(state, kase, 'auto-release');
          State.log(state, 'Contested case expired unanswered — released.', null);
        } else {
          goCold(state, kase, 'expired');
          if (kase.type === 'SYNDICATE') State.log(state, 'Syndicate file went cold.', null);
        }
      }
    }
  }

  return { byId, openCrime, attachRead, tick, close, goCold, usableEvidence, grade, gradeOpts, nodeDist, pairCoherent, contradictionPairs };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = { CaseSystem };

// ============================================================
// VANDALS
// ============================================================

// ============================================================
// VANDALS — scrappers want the panel, taggers are bored, the
// Fixer wants you blind before a job (§11.2). Rate limits and
// unreachable-target fallbacks keep the AI from livelocking
// (§11.4, proven by test_vandals.js). A vandal acting inside
// another camera's sightline is being recorded — that case is
// the counterplay (§11.3).
// ============================================================

var VandalSystem = (() => {

  function edgeRoadNodes(state) {
    const m = state.map;
    return m.nodes.filter(n =>
      (n.x === 0 || n.y === 0 || n.x === m.W - 1 || n.y === m.H - 1) && m.adj[n.id].length > 0);
  }

  function pickTarget(state, vandal) {
    // nobody strips a pole with a uniform standing on it
    const cams = state.cameras.filter(c => c.type !== 'OFFICER');
    if (!cams.length) return null;
    if (vandal.type === 'SCRAPPER') {
      // isolation: fewest other cameras watching the pole
      let best = null, bestScore = Infinity;
      for (const c of cams) {
        const watchers = Sightlines.camerasWatchingNode(state, c.node, c.id).length;
        const score = watchers * CONFIG.Vandals.SCRAPPER.ISOLATION_WEIGHT + State.rngNext(state, 'vandals') * 0.5;
        if (score < bestScore) { bestScore = score; best = c; }
      }
      return best;
    }
    if (vandal.type === 'TAGGER') {
      const at = vandal.path ? vandal.path[vandal.at] : vandal.spawnNode;
      let best = null, bestD = Infinity;
      for (const c of cams) {
        const d = CaseSystem.nodeDist(state, at, c.node);
        if (d < bestD) { bestD = d; best = c; }
      }
      return best;
    }
    // FIXER: the single highest-coverage camera
    let best = null, bestCov = -1;
    for (const c of cams) {
      if (c.sight.length > bestCov) { bestCov = c.sight.length; best = c; }
    }
    return best;
  }

  function walkRoute(state, from, to) {
    return Traffic.route(state, from, to, null);
  }

  function spawn(state, type, crewId, forcedTargetCamId, spawnNode) {
    let from = spawnNode;
    if (from === undefined) {
      const edges = edgeRoadNodes(state);
      if (!edges.length) return null;
      from = edges[Math.floor(State.rngNext(state, 'vandals') * edges.length)].id;
    }
    const vandal = {
      id: state.nextVandalId++, type, crewId,
      spawnNode: from, path: null, at: 0, segT: 0,
      targetCamId: forcedTargetCamId || null, forced: !!forcedTargetCamId,
      state: 'MOVE', actT: 0, needT: 0,
      lastRetarget: -Infinity, stuckT: 0, idleT: 0,
      spawnedAt: state.time, lastWitnessRead: -Infinity,
      revealedAt: state.time + (state.trust < CONFIG.Economy.LOW_TRUST_AT ? CONFIG.Vandals.REVEAL_DELAY_LOW_TRUST : 0)
    };
    state.vandals.push(vandal);
    state.stats.vandalsSpawned++;
    State.emit(state, { type: 'vandalSpawn', vandalId: vandal.id, vandalType: type, node: from });
    return vandal;
  }

  function actDuration(state, vandal, cam) {
    const V = CONFIG.Vandals;
    let t = vandal.type === 'SCRAPPER' ? V.SCRAPPER.DESTROY_SECONDS
      : vandal.type === 'TAGGER' ? V.TAGGER.DEGRADE_SECONDS
      : V.FIXER.DESTROY_SECONDS;
    if (cam.hardened && vandal.type !== 'TAGGER') t *= V.HARDENED_TIME_MULT;
    return t;
  }

  // The §11.3 signature: cameras watching the vandal's pole take reads of
  // the crew while it works. Those reads build a VANDAL case like any other.
  function witness(state, vandal, node) {
    if (state.time - vandal.lastWitnessRead < CONFIG.Vandals.WITNESS_READ_INTERVAL) return;
    const watchers = Sightlines.camerasWatchingNode(state, node);
    const crew = state.crews[vandal.crewId];
    if (!watchers.length || !crew || crew.caught) return;
    vandal.lastWitnessRead = state.time;
    for (const camId of watchers) {
      const cam = CameraSystem.byId(state, camId);
      if (!cam || cam.node === node) continue;  // a pole cannot testify for itself
      const entry = cam.sight.find(e => {
        const s = state.map.segs[e.seg];
        return s.a === node || s.b === node;
      });
      if (!entry) continue;
      const conf = Sightlines.liveConfidence(state, cam, entry);
      const qualifying = conf >= state.threshold;
      let kase = state.cases.find(c => c.crewId === crew.id && c.type === 'VANDAL' &&
        (c.status === 'OPEN' || c.status === 'CONTESTED'));
      if (!kase && qualifying) {
        if (!crew.plate) crew.plate = makePlate(() => State.rngNext(state, 'plates'));
        kase = {
          id: state.nextCaseId++, type: 'VANDAL', plate: crew.plate, crewId: crew.id,
          kind: 'VANDALISM', landmark: 'A CAMERA POLE',
          witnessDesc: 'HOODED FIGURE',
          spawnNode: node, openedAt: state.time,
          coldAt: state.time + CONFIG.Cases.LIFETIME_SECONDS,
          status: 'OPEN', riskAnnounced: false,
          closedTriple: null, falseCharge: false, contested: null, _peakUsable: 0
        };
        state.cases.push(kase);
        state.stats.witnessCases++;
        State.emit(state, { type: 'witnessCase', caseId: kase.id, camId: cam.id, node });
        State.log(state, 'A neighbouring camera caught the vandal at work. Case opened.', 'first-witness');
      }
      const read = {
        id: state.nextReadId++, t: state.time, segId: entry.seg, vehId: null,
        subjectNode: node,     // where the figure stood — the still shoots this
        crewId: crew.id,
        actualPlate: crew.plate || 'CREW', plate: crew.plate || 'CREW',
